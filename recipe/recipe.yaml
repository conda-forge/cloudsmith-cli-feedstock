schema_version: 1

context:
  version: "1.30.0"

package:
  name: cloudsmith-cli
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/cloudsmith-cli/cloudsmith_cli-${{ version }}.tar.gz
  sha256: f76c9330b1215fe6af6a42fe171249766fe5b3e4922d437ea2d2bc6e94e4335b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - cloudsmith = cloudsmith_cli.cli.commands.main:main
      - terraform-credentials-cloudsmith = cloudsmith_cli.wrapper:main_entry

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools ==84.0.0
    - wheel ==0.48.0
  run:
    - python >=${{ python_min }}
    - certifi >=2024.7.4
    - click >=8.2,!=8.3.0
    - click-configfile >=0.2.3
    - click-didyoumean >=0.0.3
    - click-spinner >=0.1.7
    - json5 >=0.9.0
    - cloudsmith-api >=2.0.38,<3.0
    - keyring >=25.4.1
    - keyrings.alt >=5.0.2
    - keyrings.cryptfile >=1.3.9
    - mcp ==2.3.0
    - pydantic-settings >=2.14.2
    - pyjwt >=2.13.0
    - cryptography >=50.0.0
    - python-toon ==0.2.0
    - requests >=2.32.5
    - requests-toolbelt >=1.0.0
    - rich >=13.0.0
    - semver >=2.7.9
    - sentry-sdk >=2,<3
    - starlette >=1.3.1
    - urllib3 >=2.5
    - tomlkit >=0.15.0

tests:
  - python:
      imports:
        - cloudsmith_cli
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true
  - script:
      - cloudsmith --help
      - cloudsmith --version
      - cloudsmith credential-helper --help
      - terraform-credentials-cloudsmith --help
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  homepage: https://cloudsmith.com
  repository: https://github.com/cloudsmith-io/cloudsmith-cli
  license: Apache-2.0
  license_file: LICENSE
  summary: Command-line interface for Cloudsmith
  documentation: https://docs.cloudsmith.com/developer-tools/cli

extra:
  recipe-maintainers:
    - BartoszBlizniak
